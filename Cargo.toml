[package]
name = "ragfmsg"
version = "0.1.0"
edition = "2021"
description = "Reference architecture glue for a multiplayer space game: seam contracts and tests"

[lib]
path = "src/lib.rs"

[dependencies]
bevy_ecs = "0.20.1"
rapier3d-f64 = "0.36.1"
lightyear = { version = "0.31.0", default-features = false, features = ["std", "client", "server", "replication"] }
serde = { version = "1.0", features = ["derive"] }
bevy_replicon = "0.45.6"
bevy_input = { version = "0.20.1", features = ["keyboard", "gamepad", "touch"] }
lightyear_core = "0.31.0"
nalgebra = "0.35.0"
rstar = "0.13.1"
hmac = "0.12.1"
sha2 = "0.10.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = "1.0"
serde_json = "1.0"
rand = "0.9"
bincode = "1.3.3"
